<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Game | Joshua Patrick Allen</title>
<meta name="description" content="Josh Allen's next opponent: game details, his career history against them, and box scores from past meetings.">
<link rel="stylesheet" href="css/site.css?v=15">
</head>
<body>
<header class="hero slim"><div class="wrap">
  <nav class="nav"><a href="/">Stats &amp; records</a><a href="matchup.html" aria-current="page">Next game</a></nav>
  <h1 id="title">Next game</h1>
  <div class="vs" id="vs"></div>
  <p class="when" id="when"></p>
</div></header>
<main class="panel">
  <div class="card" id="vsAllen"></div>
  <h2 class="sec">Team comparison, 2026</h2>
  <div class="card" id="cmp"></div>
  <h2 class="sec" id="billsSeasonHead">Buffalo this season</h2>
  <div class="scroll"><table id="season"></table></div>
  <h2 class="sec" id="oppSeasonHead">Las Vegas this season</h2>
  <div class="scroll"><table id="oppSeason"></table></div>
  <h2 class="sec" id="boxHead">Past meetings</h2>
  <div id="boxes"></div>
  <h2 class="sec">Series and injuries</h2>
  <div class="card" id="extra"></div>
  <p class="note" id="srcnote"></p>
</main>
<footer id="foot">Unofficial fan site; not affiliated with the Buffalo Bills, the NFL or Josh Allen.</footer>
<script>
function fmt(n){return n.toLocaleString('en-US');}
function td(v){return '<td>'+v+'</td>';}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function li(a){return a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');}
function stat(v,l){return '<div><b>'+v+'</b><span>'+l+'</span></div>';}
// Live data comes from the stats-data branch on GitHub (refreshed hourly, no Netlify redeploy needed); the copy in /data is the fallback.
var SRC=['https://raw.githubusercontent.com/JPADev1/Joshuapatrickallen/stats-data/','data/'];
function load(name){var i=0;function next(){var u=SRC[i++]+name;return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).catch(function(e){if(i<SRC.length)return next();throw e;});}return next();}
Promise.all([load('matchup.json'),load('allen-2026.json')]).then(function(res){
  var m=res[0], a=res[1];
  document.getElementById('title').textContent=(m.label||('Week '+m.week))+': '+(m.home?'vs':'at')+' the '+m.opp.name;
  var b='<div class="team"><b>'+esc(m.bills.name)+'</b><span>'+esc(m.bills.record)+'</span></div>';
  var o='<div class="team"><b>'+esc(m.opp.name)+'</b><span>'+esc(m.opp.record)+'</span></div>';
  document.getElementById('vs').innerHTML = (m.home ? o+'<div class="at">at</div>'+b : b+'<div class="at">at</div>'+o);
  document.getElementById('when').textContent=[m.date,m.time,m.venue,m.tv].filter(Boolean).join(' · ');
  var T=m.teamStats, L=m.home?m.opp:m.bills, R=m.home?m.bills:m.opp, lk=m.home?'opp':'bills', rk=m.home?'bills':'opp';
  document.getElementById('cmp').innerHTML='<div class="cmphead"><b>'+esc(L.name)+'</b><b>'+esc(R.name)+'</b></div>'+T.cats.map(function(c){
    var l=c[lk], r=c[rk], ls=33-l.rank, rs=33-r.rank, p=Math.round(100*ls/(ls+rs));
    var lw=l.rank<r.rank, rw=r.rank<l.rank;
    return '<div class="cmprow"><div class="cmplab">'+esc(c.label)+'</div><div class="cmpnums"><span class="'+(lw?'adv':'')+'"><b>'+l.v.toFixed(c.dec)+'</b> <i>#'+l.rank+'</i></span><span class="'+(rw?'adv':'')+'"><i>#'+r.rank+'</i> <b>'+r.v.toFixed(c.dec)+'</b></span></div>'
     +'<div class="cmpbar" role="img" aria-label="'+esc(c.label)+': '+(lw?esc(L.name)+' has the edge':rw?esc(R.name)+' has the edge':'even')+'"><u class="l'+(lw?' adv':'')+'" style="width:'+p+'%"></u><u class="r'+(rw?' adv':'')+'" style="width:'+(100-p)+'%"></u></div></div>';
  }).join('')+'<p class="note">'+esc(T.note)+' As of '+esc(T.asOf)+'. The longer bar marks the team with the better league rank.</p>';
  document.documentElement.style.setProperty('--cl',(m.home?m.colors.opp:m.colors.bills));
  document.documentElement.style.setProperty('--cr',(m.home?m.colors.bills:m.colors.opp));
  document.getElementById('billsSeasonHead').textContent='Buffalo this season (Allen\'s game log)';
  document.getElementById('oppSeasonHead').textContent=m.opp.name.replace(/ \S+$/,'')+' this season';
  document.getElementById('oppSeason').innerHTML='<thead><tr><th>Wk</th><th>Opp</th><th>Result</th></tr></thead><tbody>'+m.oppSeason.map(function(g){var w=/^W/.test(g.result);return '<tr>'+td(g.week)+td((g.home?'':'@ ')+g.opp)+td('<span class="res '+(w?'w':'l')+'">'+g.result+'</span>')+'</tr>';}).join('')+'</tbody>';
  var v=m.allenVs;
  document.getElementById('vsAllen').innerHTML='<div class="head"><h2>Allen against the '+esc(m.opp.name)+'</h2><div class="chips"><span class="chip hold">'+v.wins+'-'+v.losses+' as a starter</span></div></div>'
   +'<div class="stats">'+stat(v.games,'Games')+stat(v.cmp+'-'+v.att,'Cmp-Att')+stat(fmt(v.yds),'Pass yards')+stat(v.td,'Pass TD')+stat(v.int,'INT')+stat(v.rating.toFixed(1),'Passer rating')+stat(v.rushAtt+' / '+v.rushYds,'Rush att / yds')+stat(v.rushTD,'Rush TD')+'</div>'
   +'<p class="note">Regular season only. Career totals against this opponent.</p>';
  var rows='';
  a.games.forEach(function(g){
    var w=/^W/.test(g.result||''), res=g.result?'<span class="res '+(w?'w':'l')+'">'+g.result+'</span>':'&mdash;';
    rows+='<tr>'+td(g.week)+td((g.home===false?'@ ':'')+g.opp)+td(res)+td(g.cmp+'-'+g.att)+td(g.yds)+td(g.td)+td(g.int)+td(g.rushAtt)+td(g.rushYds)+td(g.rushTD)+'</tr>';
  });
  document.getElementById('season').innerHTML='<thead><tr><th>Wk</th><th>Opp</th><th>Result</th><th>Cmp-Att</th><th>Yds</th><th>TD</th><th>INT</th><th>Rush</th><th>Yds</th><th>TD</th></tr></thead><tbody>'+rows+'</tbody>';
  document.getElementById('boxes').innerHTML=m.boxscores.map(function(x){
    var n=x.line[0].length, hd=n===1?['Final']:n===6?['1','2','3','4','OT','Final']:['1','2','3','4','Final'];
    var ls='<thead><tr><th>Team</th>'+hd.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+x.teams.map(function(t,i){return '<tr>'+td(t)+x.line[i].map(function(v,j){return j===n-1?'<td><b>'+v+'</b></td>':td(v);}).join('')+'</tr>';}).join('')+'</tbody>';
    return '<div class="card"><div class="head"><h2>'+esc(x.date)+' ('+esc(x.week)+')</h2><div class="chips"><span class="chip">'+esc(x.site)+'</span></div></div>'
     +'<div class="scroll" style="margin:10px 0"><table>'+ls+'</table></div>'
     +(x.allen?'<p style="margin:6px 0"><b>Josh Allen:</b> '+esc(x.allen)+'</p>':'')
     +'<div class="lines"><div><h3>Bills</h3><ul>'+li(x.bills)+'</ul></div><div><h3>'+esc(m.opp.nick||m.opp.name)+'</h3><ul>'+li(x.opp)+'</ul></div></div>'
     +'<p class="note">Source: '+esc(x.source)+'</p></div>';
  }).join('');
  var inj=m.injuries, nick=m.opp.nick||m.opp.name;
  function pills(L){
    if(!L.length)return '<p class="note" style="margin:4px 0">No one listed yet.</p>';
    return L.map(function(x){ if(typeof x==='string')return '<span class="pill">'+esc(x)+'</span>';
      return '<span class="pill">'+esc(x.name)+' ('+esc(x.pos)+')'+(x.injury?', '+esc(x.injury):'')+': <b>'+esc(x.status)+'</b></span>';}).join('');}
  var asof=inj.asOf?' ('+esc(inj.asOf)+')':(inj.week?' (Week '+inj.week+' report)':'');
  document.getElementById('extra').innerHTML='<p style="margin:0 0 6px"><b>'+esc(m.series.summary)+'</b> '+esc(m.series.last)+'</p>'
   +'<div class="lines"><div><h3>Bills injuries'+asof+'</h3>'+pills(inj.bills)+'</div><div><h3>'+esc(nick)+' injuries'+asof+'</h3>'+pills(inj.opp)+'</div></div>'
   +'<p class="note">'+esc(inj.note)+' DNP = did not practice.</p>';
  document.getElementById('srcnote').textContent=m.sources+' Last updated '+m.updated+'.';
}).catch(function(){
  document.getElementById('title').textContent='Next game';
  document.getElementById('when').textContent='The matchup data could not be loaded. Please refresh.';
});
</script>

</body>
</html>
