name: Update stats data

on:
  schedule:
    - cron: "0 10 * * *"        # every day, 6:00 a.m. Eastern
    - cron: "0 14 * * 1,2,5"    # Mon/Tue/Fri, 10:00 a.m. Eastern (after game nights)
  workflow_dispatch: {}          # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest stats
        run: python scripts/update_data.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add data
            git commit -m "Update stats data"
            git push
          fi
