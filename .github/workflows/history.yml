name: Build touchdown history (one-time)

# Runs only on the history-build branch. Nothing here touches main, so Netlify never deploys.
on:
  push:
    branches: [history-build]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: history-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse Wikipedia pages fetched by earlier runs
        uses: actions/cache@v4
        with:
          path: out/pages
          key: wiki-pages-${{ github.run_id }}
          restore-keys: wiki-pages-
      - name: Run
        run: bash run.sh
      - name: Save results to this branch
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add -A
            git commit -m "History build output [skip ci]"
            git push
          fi
